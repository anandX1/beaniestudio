name: SEO & performance guard

on:
  push:
    branches: [main]
  schedule:
    # Every day 06:00 UTC — catches regressions even when nothing was pushed.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site

      - name: Typecheck
        run: npm run check
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - name: Internal link check
        run: npm run check:links
        working-directory: site

      # Google's open-source Lighthouse against the six real content pages
      # (served build). Gates run in warn mode until a CI baseline exists —
      # then flip "warn" to "error" in site/.lighthouserc.json.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun --config=.lighthouserc.json
        working-directory: site

      - name: Lighthouse report
        if: always()
        working-directory: site
        run: node scripts/lh-summary.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: site/reports/
          retention-days: 14

      # On push, Cloudflare is deploying the commit we just pushed — give it
      # a minute so the live audit checks the NEW deploy, not the old one.
      - name: Wait for deploy
        if: github.event_name == 'push'
        run: sleep 60

      - name: Live production audit
        run: npm run audit:live
        working-directory: site

      # Only on push to main (skip scheduled runs and PRs): ping Bing/Yandex/Seznam.
      - name: IndexNow ping
        if: github.event_name == 'push'
        run: npm run ping:indexnow
        working-directory: site

      # ---- Autonomous distribution ----
      # Post new blog entries to Discord/Bluesky with UTM-tagged links.
      # State roll-forward via cache; if the cache is ever lost the script
      # reseeds and stays silent — it can never re-spam the feed.
      - name: Restore social broadcast state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: site/.state
          key: social-state-v1-${{ github.run_id }}
          restore-keys: social-state-v1-

      - name: Broadcast new blog entries
        if: github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: npm run social:post
        working-directory: site

      - name: Save social broadcast state
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: site/.state
          key: social-state-v1-${{ github.run_id }}
