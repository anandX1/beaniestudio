name: SEO & performance guard

on:
  push:
    branches: [main]
  schedule:
    # Every day 06:00 UTC — catches regressions even when nothing was pushed.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site

      - name: Typecheck
        run: npm run check
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - name: Internal link check
        run: npm run check:links
        working-directory: site

      # Google's open-source Lighthouse against the six real content pages
      # (served build). Gates run in warn mode until a CI baseline exists —
      # then flip "warn" to "error" in site/.lighthouserc.json.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun --config=.lighthouserc.json
        working-directory: site

      - name: Lighthouse report
        if: always()
        working-directory: site
        run: |
          node -e "
          const fs = require('fs');
          let files = [];
          try { files = fs.readdirSync('reports').filter(f => f.endsWith('.json')); } catch {}
          let out = '## Lighthouse results\n\n| Page | Perf | SEO | A11y | BP |\n|---|---|---|---|---|\n';
          let rows = 0;
          for (const f of files) {
            try {
              const r = JSON.parse(fs.readFileSync('reports/' + f, 'utf8'));
              if (!r || !r.categories) continue;
              let page = f;
              try { page = decodeURIComponent(new URL(r.finalDisplayedUrl || r.finalUrl || r.requestedUrl).pathname); } catch {}
              const s = c => r.categories[c] && r.categories[c].score != null ? Math.round(r.categories[c].score * 100) : '–';
              out += '| ' + page + ' | ' + s('performance') + ' | ' + s('seo') + ' | ' + s('accessibility') + ' | ' + s('best-practices') + ' |\n';
              rows++;
            } catch { /* a bad report never kills the pipeline */ }
          }
          if (!rows) out += '| (no parsable reports — check artifacts) | | | | |\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          console.log(out);
          ""

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: site/reports/
          retention-days: 14

      # On push, Cloudflare is deploying the commit we just pushed — give it
      # a minute so the live audit checks the NEW deploy, not the old one.
      - name: Wait for deploy
        if: github.event_name == 'push'
        run: sleep 60

      - name: Live production audit
        run: npm run audit:live
        working-directory: site

      # Only on push to main (skip scheduled runs and PRs): ping Bing/Yandex/Seznam.
      - name: IndexNow ping
        if: github.event_name == 'push'
        run: npm run ping:indexnow
        working-directory: site
