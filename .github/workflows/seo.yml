name: SEO & performance guard

on:
  push:
    branches: [main]
  schedule:
    # Every day 06:00 UTC — catches regressions even when nothing was pushed.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the broadcast ledger is committed back after broadcasting
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site

      - name: Typecheck
        run: npm run check
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - name: Internal link check
        run: npm run check:links
        working-directory: site

      # Google's open-source Lighthouse against the six real content pages
      # (served build). Gates run in warn mode until a CI baseline exists —
      # then flip "warn" to "error" in site/.lighthouserc.json.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun --config=.lighthouserc.json
        working-directory: site

      - name: Lighthouse report
        if: always()
        working-directory: site
        run: node scripts/lh-summary.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: site/reports/
          retention-days: 14

      # On push, Cloudflare is deploying the commit we just pushed — give it
      # a minute so the live audit checks the NEW deploy, not the old one.
      - name: Wait for deploy
        if: github.event_name == 'push'
        run: sleep 60

      - name: Live production audit
        run: npm run audit:live
        working-directory: site

      # Only on push to main (skip scheduled runs and PRs): ping Bing/Yandex/Seznam.
      - name: IndexNow ping
        if: github.event_name == 'push'
        run: npm run ping:indexnow
        working-directory: site

      # ---- Autonomous distribution ----
      # Post new blog entries to Discord/Bluesky with UTM-tagged links.
      # The ledger (site/content/social-state.json) is a TRACKED file — the
      # repo itself is the broadcast memory, shared with local deploys via a
      # union-merge. A fresh checkout always knows what was already delivered;
      # no cache can evaporate and cause a silent re-seed.
      - name: Broadcast new blog entries
        if: github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: npm run social:post
        working-directory: site

      # Persist deliveries so nothing ever broadcasts twice. [skip ci] keeps
      # this commit from re-triggering this workflow and Cloudflare's build.
      - name: Commit broadcast ledger
        if: github.event_name != 'pull_request'
        working-directory: site
        run: |
          git config user.name "beanie-broadcast-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet content/social-state.json; then
            echo "ledger unchanged — nothing delivered"
          else
            git add content/social-state.json
            git commit -m "chore: broadcast ledger update [skip ci]"
            git push
          fi
